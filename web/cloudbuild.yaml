steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - NEXT_PUBLIC_API_URL=$_API_URL
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/billions/web:latest
      - .
images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/billions/web:latest
substitutions:
  _API_URL: ""
